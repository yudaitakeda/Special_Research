<!-- トラックパッド -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視線スクロールテスト</title>
    <style>
        body {
            height: 2000px;
            font-size: 18px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }
        #page-content {
            margin-top: 100px;
            font-size: 32px;
        }
        /* タイマーを左下に表示 */
        #timer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 22px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>視線スクロールテスト</h1>
        <p id="page-content">{{ page_text }}</p>
        <a href="/distance_travelled">視線移動距離のページを見る</a>
    </div>
    <!-- Page: 1 は削除 -->
    <div id="timer">0:00</div> <!-- タイマー表示 -->

    <script>
        let hasScrolled = false;
        let lastGazeX = 0;
        let scrollBackStartTime = null;

        function getGazeData() {
            fetch('/gaze_data')
                .then(response => response.json())
                .then(data => {
                    const x = data.x;
                    const y = data.y;
                    const currentTime = Date.now();

                    if (x > 0.8 && !hasScrolled && lastGazeX < x) {
                        // window.scrollBy(0, 30);
                        hasScrolled = true;
                    } else if (x < 0.5) {
                        hasScrolled = false;
                    }

                    if (x < 0.2 && y < 0.5) {
                        if (!scrollBackStartTime) {
                            scrollBackStartTime = currentTime;
                        } else if (currentTime - scrollBackStartTime > 500) {
                            // window.scrollBy(0, -30);
                            scrollBackStartTime = null;
                        }
                    } else {
                        scrollBackStartTime = null;
                    }

                    lastGazeX = x;
                })
                .catch(error => console.error("視線データ取得エラー:", error));
        }

        setInterval(getGazeData, 100);

        // ====== タイマー機能 ======
        let timerInterval = null;
        let elapsedSeconds = 0;

        function updateTimerDisplay() {
            const minutes = Math.floor(elapsedSeconds / 60);
            const seconds = elapsedSeconds % 60;
            document.getElementById("timer").textContent =
                `${minutes}:${seconds.toString().padStart(2, "0")}`;
        }

        function startTimer() {
            if (timerInterval) return; // 多重スタート防止
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "a") {
                startTimer();
            } else if (event.key === "s") {
                stopTimer();
            }
        });

        updateTimerDisplay();
    </script>
</body>
</html>
