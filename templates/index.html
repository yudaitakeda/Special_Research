<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>視線対応・動的読書ツール</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.8;
      padding: 20px;
      background: #f5f5f5;
    }

    /* 作者・作品メニュー */
    .menu-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .menu-item {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-item:hover, .menu-item.gaze-focus {
      background: #e0f7fa;
      border-color: #00acc1;
    }

    /* 本文エリア */
    .work-container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      min-height: 80vh;
      overflow: hidden;
    }

    /* 視線カーソル */
    #gaze-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid red;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 9999;
    }

    .gaze-zone-left, .gaze-zone-right {
      position: fixed;
      width: 20%;
      height: 20%;
      bottom: 0;
      background-color: rgba(0,255,0,0.2);
      pointer-events: none;
      z-index: 999;
    }

    .gaze-zone-left { left: 0; }
    .gaze-zone-right { right: 0; }
  </style>
</head>
<body>

  <div class="gaze-zone-left"></div>
  <div class="gaze-zone-right"></div>

  <h3>作者を選択：</h3>
  <div id="authorMenu" class="menu-section"></div>

  <h3>作品を選択：</h3>
  <div id="workMenu" class="menu-section"></div>

  <div class="work-container" id="work-container">
    <h2 id="work-title"></h2>
    <div id="work-content"></div>
  </div>

  <div id="gaze-cursor"></div>

  <script src="{{ url_for('static', filename='gaze_scroll.js') }}"></script>

  <script>
    // ===============================
    // 作者リスト取得
    // ===============================
    fetch('/api/authors')
      .then(res => res.json())
      .then(authors => {
        const menu = document.getElementById('authorMenu');
        authors.forEach(a => {
          const div = document.createElement('div');
          div.textContent = a;
          div.className = 'menu-item';
          div.addEventListener('click', () => loadWorks(a));
          menu.appendChild(div);
        });
      });

    // ===============================
    // 作品リスト取得
    // ===============================
    function loadWorks(author) {
      fetch(`/api/works/${author}`)
        .then(res => res.json())
        .then(works => {
          const menu = document.getElementById('workMenu');
          menu.innerHTML = '';
          works.forEach(w => {
            const div = document.createElement('div');
            div.textContent = w;
            div.className = 'menu-item';
            div.addEventListener('click', () => loadWorkContent(author, w));
            menu.appendChild(div);
          });
        });
    }

    // ===============================
    // 本文取得
    // ===============================
    function loadWorkContent(author, title) {
      fetch(`/api/work/${author}/${title}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('work-title').textContent = `${data.author}『${data.title}』`;
          document.getElementById('work-content').innerHTML = data.content.replace(/\n/g, '<br>');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          // 本文エリアまで自動スクロール
          document.getElementById('work-container').scrollIntoView({ behavior: 'smooth' });
        });
    }

    // ===============================
    // 視線注視によるクリック判定
    // ===============================
    let gazeX = 0.5, gazeY = 0.5;
    let currentFocus = null;
    let focusStart = 0;
    const FOCUS_TIME = 1000;

    async function updateGaze() {
      try {
        const res = await fetch('/gaze_data');
        const data = await res.json();
        gazeX = data.x;
        gazeY = data.y;
      } catch {}
      requestAnimationFrame(updateGaze);
    }
    updateGaze();

    function checkFocus() {
      const x = gazeX * window.innerWidth;
      const y = gazeY * window.innerHeight;
      const elements = document.querySelectorAll('.menu-item');
      let focused = null;

      for (const el of elements) {
        const rect = el.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          focused = el;
          break;
        }
      }

      // 注視中ハイライト
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('gaze-focus'));
      if (focused) focused.classList.add('gaze-focus');

      if (focused !== currentFocus) {
        currentFocus = focused;
        focusStart = performance.now();
      } else if (focused && performance.now() - focusStart > FOCUS_TIME) {
        focused.click();
        focusStart = performance.now() + 1500; // 連続クリック防止
      }

      requestAnimationFrame(checkFocus);
    }
    checkFocus();
  </script>
</body>
</html>
