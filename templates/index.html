<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>視線対応・動的読書ツール</title>

  <style>
    body {
      font-family: sans-serif;
      line-height: 1.8;
      padding: 20px;
      background: #f5f5f5;
    }

    /* -------------------------
       作者・作品メニューの見た目
       ------------------------- */
    .menu-section {
      display: flex;
      flex-wrap: wrap; /* 横に並ばない場合は折り返す */
      gap: 8px;
      margin-bottom: 20px;
    }

    .menu-item {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    /* 視線が当たっているとき（JS でクラス追加） */
    .menu-item:hover,
    .menu-item.gaze-focus {
      background: #e0f7fa;
      border-color: #00acc1;
    }

    /* -------------------------
       本文エリアのデザイン
       ------------------------- */
    .work-container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      min-height: 80vh; /* ある程度の高さを確保 */
      overflow: hidden;
    }

    /* -------------------------
       視線カーソル（赤丸）
       ------------------------- */
    #gaze-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid red;
      border-radius: 50%;
      pointer-events: none; /* クリックを邪魔しない */
      transform: translate(-50%, -50%);
      display: none; /* 既存 gaze_scroll.js が表示制御 */
      z-index: 9999;
    }

    /* 右下のズームエリア（既存機能） */
    .gaze-zone-left,
    .gaze-zone-right {
      position: fixed;
      width: 20%;
      height: 20%;
      bottom: 0;
      background-color: rgba(0,255,0,0.2);
      pointer-events: none;
      z-index: 999;
    }

    .gaze-zone-left { left: 0; }
    .gaze-zone-right { right: 0; }
  </style>
</head>
<body>

  <!-- ズーム機能用 -->
  <div class="gaze-zone-left"></div>
  <div class="gaze-zone-right"></div>

  <h3>作者を選択：</h3>
  <div id="authorMenu" class="menu-section"></div>

  <h3>作品を選択：</h3>
  <div id="workMenu" class="menu-section"></div>

  <!-- 本文表示エリア -->
  <div class="work-container" id="work-container">
    <h2 id="work-title"></h2>
    <div id="work-content"></div>
  </div>

  <!-- 視線カーソル -->
  <div id="gaze-cursor"></div>

  <!-- 既存のスクロール機能 -->
  <script src="{{ url_for('static', filename='gaze_scroll.js') }}"></script>

  <script>
    /* ==========================================================
       1. 作者リスト取得
       ========================================================== */
    fetch('/api/authors')
      .then(res => res.json())
      .then(authors => {
        const menu = document.getElementById('authorMenu');

        authors.forEach(a => {
          const div = document.createElement('div');
          div.textContent = a;
          div.className = 'menu-item';

          // クリック（視線クリックもここに来る）
          div.addEventListener('click', () => loadWorks(a));

          menu.appendChild(div);
        })
      });

    /* ==========================================================
       2. 作品リスト取得
       ========================================================== */
    function loadWorks(author) {
      fetch(`/api/works/${author}`)
        .then(res => res.json())
        .then(works => {
          const menu = document.getElementById('workMenu');
          menu.innerHTML = '';  // 前の作品リストを消す

          works.forEach(w => {
            const div = document.createElement('div');
            div.textContent = w;
            div.className = 'menu-item';

            div.addEventListener('click', () => loadWorkContent(author, w));

            menu.appendChild(div);
          });
        });
    }

    /* ==========================================================
       3. 本文取得
       ========================================================== */
    function loadWorkContent(author, title) {
      fetch(`/api/work/${author}/${title}`)
        .then(res => res.json())
        .then(data => {

          // タイトル部分書き換え
          document.getElementById('work-title').textContent =
            `${data.author}『${data.title}』`;

          // 改行 → <br>
          document.getElementById('work-content').innerHTML =
            data.content.replace(/\n/g, '<br>');

          // 画面トップへ
          window.scrollTo({ top: 0, behavior: 'smooth' });

          // 本文エリアまで自動スクロール
          document.getElementById('work-container')
                  .scrollIntoView({ behavior: 'smooth' });
        });
    }

    /* ==========================================================
       4. 視線による "メニュー項目のクリック" 判定
       ========================================================== */

    let gazeX = 0.5, gazeY = 0.5;  // 直近の視線座標（0〜1）
    let currentFocus = null;        // 注視している要素
    let focusStart = 0;             // 注視開始した時間
    const FOCUS_TIME = 1000;        // 1秒注視でクリック

    /* --- 視線取得ループ（100% 常時実行） --- */
    async function updateGaze() {
      try {
        const res = await fetch('/gaze_data');
        const data = await res.json();

        gazeX = data.x;   // 0〜1
        gazeY = data.y;   // 0〜1
      } catch {}

      requestAnimationFrame(updateGaze);
    }
    updateGaze();

    /* --- 注視によるクリック判定 --- */
    function checkFocus() {
      const x = gazeX * window.innerWidth;
      const y = gazeY * window.innerHeight;

      // 作者・作品メニューすべて対象
      const elements = document.querySelectorAll('.menu-item');
      let focused = null;

      // 視線が重なっている要素を探す
      for (const el of elements) {
        const rect = el.getBoundingClientRect();

        if (x >= rect.left && x <= rect.right &&
            y >= rect.top && y <= rect.bottom) {
          focused = el;
          break;
        }
      }

      // まず全項目からハイライト削除
      document.querySelectorAll('.menu-item')
              .forEach(el => el.classList.remove('gaze-focus'));

      // 視線が当たっている項目だけハイライト
      if (focused) focused.classList.add('gaze-focus');

      // 注視開始
      if (focused !== currentFocus) {
        currentFocus = focused;
        focusStart = performance.now();   // 注視開始時刻をリセット
      }
      // 一定時間（FOCUS_TIME）注視 → click 発火
      else if (focused && performance.now() - focusStart > FOCUS_TIME) {
        focused.click();
        focusStart = performance.now() + 1500;  // 誤連打防止（1.5秒）
      }

      requestAnimationFrame(checkFocus);
    }
    checkFocus();
  </script>

</body>
</html>
